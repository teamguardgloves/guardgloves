<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guard Gloves</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    /* White Brand Classes */
    .bg-brand-white { background-color: #ffffff; }
    .text-brand-white { color: #ffffff; }
    .border-brand-white { border-color: #ffffff; }

    /* Keyframes for Intro Screen */
    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }

    .animate-intro-logo {
      animation: fadeInOut 2.2s ease-in-out forwards;
    }
  </style>
</head>
<body class="bg-black text-white font-sans relative min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- ================= INTRO SCREEN OVERLAY ================= -->
  <div id="intro-screen" class="fixed inset-0 z-[100] bg-black flex items-center justify-center transition-opacity duration-700">
    <div class="h-24 sm:h-32 px-4 flex items-center justify-center">
      <img src="assets/images/logored1.webp" alt="Guard Gloves Intro Logo" class="h-full w-auto object-contain animate-intro-logo" />
    </div>
  </div>
  <!-- ======================================================== -->

  <!-- Left Floating Social Bar -->
  <div class="fixed left-0 top-1/3 z-50 flex flex-col space-y-1">
    <a href="#" class="bg-[#3b5998] text-white p-2 w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-sm sm:text-base hover:opacity-80 transition"><i class="fab font-bold fa-facebook-f"></i></a>
    <a href="#" class="bg-[#1da1f2] text-white p-2 w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-sm sm:text-base hover:opacity-80 transition"><i class="fab fa-twitter"></i></a>
    <a href="#" class="bg-[#e1306c] text-white p-2 w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-sm sm:text-base hover:opacity-80 transition"><i class="fab fa-instagram"></i></a>
    <a href="#" class="bg-[#0077b5] text-white p-2 w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-sm sm:text-base hover:opacity-80 transition"><i class="fab fa-linkedin-in"></i></a>
  </div>

  <!-- Right Floating "Verified Supplier" Badge -->
  <div class="fixed right-0 top-1/3 z-50 bg-white text-black font-bold px-1.5 sm:px-2 py-4 sm:py-6 text-xs sm:text-base shadow-lg flex items-center justify-center [writing-mode:vertical-rl] tracking-wider border-l-4 border-brand-white">
    <span class="text-blue-600 font-extrabold mr-1">✔</span> Verified Supplier
  </div>

  <!-- TOP HEADER & NAVBAR SECTION -->
  <div class="w-full pt-4">
    
    <!-- Header Logo Image Container -->
    <header class="flex justify-center items-center mb-4 px-4">
      <div class="h-16 sm:h-20 flex items-center justify-center">
        <img src="assets/images/logored1.webp" alt="Guard Gloves Logo" class="h-full w-auto object-contain" />
      </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="bg-brand-white py-3 w-full text-center text-sm sm:text-base font-extrabold uppercase tracking-widest text-black shadow-md">
      <div class="flex justify-center items-center space-x-6 sm:space-x-10 px-4">
        <a href="#" class="hover:text-[#c8382b] transition">ABOUT US</a>
        <a href="#" class="hover:text-[#c8382b] transition">CONTACT US</a>
      </div>
    </nav>

    <!-- Marquee / Events Banner -->
    <div class="bg-black text-white border-b border-gray-800 w-full text-center py-2 text-xs sm:text-base font-black uppercase tracking-wide px-2 overflow-x-auto whitespace-nowrap">
      &lt;&lt; UPCOMING EVENTS: ISPO, A+A, EICMA &gt;&gt;
    </div>

  </div>

  <!-- MAIN BODY CONTENT -->
  <div class="w-full max-w-6xl mx-auto px-4 py-8 sm:py-12 flex-grow flex flex-col justify-center">

    <!-- Grid Categories -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8 max-w-4xl mx-auto w-full my-auto">

      <!-- Category 1: SAFETY -->
      <a href="home.html" class="flex flex-col items-center group cursor-pointer w-full">
        <div class="w-full h-[350px] sm:h-[480px] bg-gray-900 border-2 border-gray-800 group-hover:border-[#c8382b] overflow-hidden relative shadow-xl rounded transition duration-300">
          <img src="assets/icon/bgimage.webp" alt="Safety" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
        </div>
        <h2 class="mt-3 sm:mt-4 text-xl sm:text-2xl font-black uppercase tracking-widest text-white group-hover:text-[#c8382b] transition duration-300">SAFETY</h2>
      </a>

      <!-- Category 2: SPORTS -->
      <a href="home2.html" class="flex flex-col items-center group cursor-pointer w-full">
        <div class="w-full h-[350px] sm:h-[480px] bg-gray-900 border-2 border-gray-800 group-hover:border-[#c8382b] overflow-hidden relative shadow-xl rounded transition duration-300">
          <img src="https://picsum.photos/600/800?safety" alt="Sports" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
        </div>
        <h2 class="mt-3 sm:mt-4 text-xl sm:text-2xl font-black uppercase tracking-widest text-white group-hover:text-[#c8382b] transition duration-300">SPORTS</h2>
      </a>

    </main>

  </div>

  <!-- FOOTER SECTION -->
  <footer class="w-full">
    <!-- Contact Info Bar -->
    <div class="border-t border-gray-800 bg-black py-4 text-sm sm:text-base font-bold text-white">
      <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-3 sm:gap-4 text-center md:text-left">
        
        <div class="flex items-center space-x-2">
          <i class="fas fa-map-marker-alt text-brand-white text-base sm:text-lg"></i>
          <span>Hajipura Road, Sialkot 51310, Punjab, Pakistan</span>
        </div>

        <div class="flex items-center space-x-2">
          <i class="fas fa-phone-alt text-brand-white text-base sm:text-lg"></i>
          <span>+92-324-4356168</span>
        </div>

        <div class="flex items-center space-x-2">
          <i class="fas fa-envelope text-brand-white text-base sm:text-lg"></i>
          <span>info@guardgloves.com</span>
        </div>

      </div>
    </div>

    <!-- Bottom Copyright Bar -->
    <div class="bg-brand-white py-2.5 px-2 text-center text-xs sm:text-sm font-black text-black uppercase tracking-wider">
      COPYRIGHT © 2025 GUARD GLOVES, ALL RIGHTS RESERVED.
    </div>
  </footer>

  <!-- Intro Screen Controller Script -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const introScreen = document.getElementById('intro-screen');
      
      // 2.2 seconds logo animation ke baad overlay ko smoothly fade out karna
      setTimeout(() => {
        introScreen.classList.add('opacity-0');
        
        // Complete fade transition ke baad screen ko DOM se hide kar dena
        setTimeout(() => {
          introScreen.style.display = 'none';
        }, 700);
      }, 2200);
    });
  </script>

</body>
</html>
